name: issue-23-foundation

on:
  push:
    branches:
      - "maple/issue-23-battle1-foundation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: mypy src
      - run: pytest
