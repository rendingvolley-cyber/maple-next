name: two-step-targeted

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "src/maple_next/ui/two_step_battle_record_ui.py"
      - "src/maple_next/__main__.py"
      - "tests/test_two_step_action_result_ui.py"
      - "tests/test_two_step_switch_result_overlay.py"
      - ".github/workflows/two-step-targeted.yml"

jobs:
  targeted:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/maple_next/ui/two_step_battle_record_ui.py tests/test_two_step_action_result_ui.py tests/test_two_step_switch_result_overlay.py
      - run: ruff check src/maple_next/ui/two_step_battle_record_ui.py tests/test_two_step_action_result_ui.py tests/test_two_step_switch_result_overlay.py
      - run: mypy src/maple_next/ui/two_step_battle_record_ui.py
      - run: python -m pytest -q tests/test_two_step_action_result_ui.py tests/test_two_step_switch_result_overlay.py
      - run: >-
          python -m pytest -q
          tests/test_issue31_action_result_lifecycle_r2.py
          tests/test_issue31_turn_state_ui_bundle_c.py
          tests/test_match_lifecycle.py
          tests/test_team_import.py
          tests/test_gemini_v2_bundle4_versioned_rules_context.py
