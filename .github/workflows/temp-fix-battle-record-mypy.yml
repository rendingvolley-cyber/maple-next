name: temp-fix-battle-record-mypy

on:
  push:
    branches:
      - maple/two-step-action-result-20260828
    paths:
      - ".github/workflows/temp-fix-battle-record-mypy.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maple/two-step-action-result-20260828
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply minimal QWidget narrowing fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/maple_next/ui/battle_record_ui.py")
          text = path.read_text(encoding="utf-8")

          old = """        outer_layout = self.centralWidget().layout()\n        assert outer_layout is not None\n"""
          new = """        central_widget = self.centralWidget()\n        assert central_widget is not None\n        outer_layout = central_widget.layout()\n        assert outer_layout is not None\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected first centralWidget pattern once, got {text.count(old)}")
          text = text.replace(old, new, 1)

          old = """        left_container = self._left_column_layout.parentWidget()\n        center_container = self._center_column_layout.parentWidget()\n        right_container = self._right_column_layout.parentWidget()\n"""
          new = """        left_container = self._left_column_layout.parentWidget()\n        center_container = self._center_column_layout.parentWidget()\n        right_container = self._right_column_layout.parentWidget()\n        assert left_container is not None\n        assert center_container is not None\n        assert right_container is not None\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected container pattern once, got {text.count(old)}")
          text = text.replace(old, new, 1)

          old = """        outer_layout = self.centralWidget().layout()\n        if outer_layout is not None:\n"""
          new = """        central_widget = self.centralWidget()\n        assert central_widget is not None\n        outer_layout = central_widget.layout()\n        if outer_layout is not None:\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected parity centralWidget pattern once, got {text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: mypy src
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/maple_next/ui/battle_record_ui.py
          git diff --cached --check
          git commit -m "fix: narrow Battle Record QWidget optionals"
          git push origin HEAD:maple/two-step-action-result-20260828
