name: issue-23-foundation

on:
  push:
    branches:
      - "maple/issue-23-battle1-foundation"
      - "maple/issue-6-pyside-selection-apply"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: mypy src
      - run: pytest

  publish-status:
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: Publish explicit commit status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VERIFY_RESULT" = "success" ]; then
            STATE="success"
            DESCRIPTION="Python 3.11 verification passed"
          else
            STATE="failure"
            DESCRIPTION="Python 3.11 verification failed"
          fi

          export STATE DESCRIPTION
          python - <<'PY'
          import json
          import os

          payload = {
              "state": os.environ["STATE"],
              "target_url": os.environ["TARGET_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "issue-23-foundation",
          }
          with open("commit-status.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          curl --fail-with-body --request POST \
            --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary @commit-status.json
