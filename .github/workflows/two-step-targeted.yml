name: two-step-targeted

on:
  pull_request:
    paths:
      - "src/maple_next/ui/two_step_battle_record_ui.py"
      - "src/maple_next/__main__.py"
      - "tests/test_two_step_action_result_ui.py"
      - ".github/workflows/two-step-targeted.yml"

jobs:
  targeted:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_two_step_action_result_ui.py
